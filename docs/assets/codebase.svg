<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="360" rx="20" fill="#F8F9FE"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">Codebase at a glance</text>
  <text x="250" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#4040D9">Lines of code by area</text>
  <text x="750" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#4040D9">REST endpoints by module</text>

  <!-- LOC bars (max 1816 -> 330px) -->
  <g font-size="13" fill="#111827">
    <text x="40" y="123" >Pages</text>
    <rect x="130" y="108" width="330" height="22" rx="6" fill="#5B5BF6"/><text x="465" y="124" font-size="12" fill="#6B7280">1,816</text>
    <text x="40" y="159">Controllers</text>
    <rect x="130" y="144" width="177" height="22" rx="6" fill="#7B7BFF"/><text x="312" y="160" font-size="12" fill="#6B7280">975</text>
    <text x="40" y="195">Styles</text>
    <rect x="130" y="180" width="152" height="22" rx="6" fill="#8B93FF"/><text x="287" y="196" font-size="12" fill="#6B7280">837</text>
    <text x="40" y="231">Components</text>
    <rect x="130" y="216" width="122" height="22" rx="6" fill="#A5ABFF"/><text x="257" y="232" font-size="12" fill="#6B7280">669</text>
    <text x="40" y="267">Models + Routes</text>
    <rect x="130" y="252" width="51" height="22" rx="6" fill="#C0C4FF"/><text x="186" y="268" font-size="12" fill="#6B7280">278</text>
    <text x="40" y="303">Context + API</text>
    <rect x="130" y="288" width="23" height="22" rx="6" fill="#D8DAFF"/><text x="158" y="304" font-size="12" fill="#6B7280">127</text>
  </g>

  <!-- Endpoint bars (5 -> 250px) -->
  <g font-size="13" fill="#111827">
    <text x="540" y="123">Customers</text>
    <rect x="640" y="108" width="250" height="22" rx="6" fill="#FF6B6B"/><text x="896" y="124" font-size="12" fill="#6B7280">5</text>
    <text x="540" y="159">Wishlist</text>
    <rect x="640" y="144" width="250" height="22" rx="6" fill="#FF8E8E"/><text x="896" y="160" font-size="12" fill="#6B7280">5</text>
    <text x="540" y="195">Cart</text>
    <rect x="640" y="180" width="250" height="22" rx="6" fill="#FFA7A7"/><text x="896" y="196" font-size="12" fill="#6B7280">5</text>
    <text x="540" y="231">Products</text>
    <rect x="640" y="216" width="200" height="22" rx="6" fill="#FFBDBD"/><text x="846" y="232" font-size="12" fill="#6B7280">4</text>
    <text x="540" y="267">Orders</text>
    <rect x="640" y="252" width="200" height="22" rx="6" fill="#FFD1D1"/><text x="846" y="268" font-size="12" fill="#6B7280">4</text>
  </g>
  <text x="750" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">23 endpoints in total</text>
  <text x="250" y="338" text-anchor="middle" font-size="12" fill="#6B7280">~3.4k frontend / ~1.3k backend (excluding lockfiles)</text>
</svg>
