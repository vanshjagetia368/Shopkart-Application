<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B5BF6"/></marker></defs>
  <rect width="1000" height="300" rx="20" fill="#F8F9FE"/>
  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="800" fill="#111827">Authentication Flow</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="30" y="100" width="150" height="80" rx="14" fill="#5B5BF6"/><text x="105" y="134" fill="#fff">Login form</text><text x="105" y="154" fill="#E6E6FF" font-size="12" font-weight="400">email + password</text>
    <rect x="225" y="100" width="150" height="80" rx="14" fill="#fff" stroke="#C7C7FA"/><text x="300" y="134" fill="#111827">Find customer</text><text x="300" y="154" fill="#6B7280" font-size="12" font-weight="400">lookup by email</text>
    <rect x="420" y="100" width="150" height="80" rx="14" fill="#fff" stroke="#C7C7FA"/><text x="495" y="134" fill="#111827">bcrypt compare</text><text x="495" y="154" fill="#6B7280" font-size="12" font-weight="400">hash vs input</text>
    <rect x="615" y="100" width="150" height="80" rx="14" fill="#fff" stroke="#C7C7FA"/><text x="690" y="134" fill="#111827">Sign JWT</text><text x="690" y="154" fill="#6B7280" font-size="12" font-weight="400">expires in 7 days</text>
    <rect x="810" y="100" width="160" height="80" rx="14" fill="#10B981"/><text x="890" y="134" fill="#fff">HttpOnly cookie</text><text x="890" y="154" fill="#D1FAE5" font-size="12" font-weight="400">Secure + SameSite</text>
  </g>
  <g stroke="#5B5BF6" stroke-width="2.5" marker-end="url(#m)">
    <line x1="182" y1="140" x2="223" y2="140"/><line x1="377" y1="140" x2="418" y2="140"/><line x1="572" y1="140" x2="613" y2="140"/><line x1="767" y1="140" x2="808" y2="140"/>
  </g>
  <rect x="30" y="215" width="940" height="56" rx="12" fill="#EEF0FC"/>
  <text x="500" y="239" text-anchor="middle" font-size="14" fill="#111827" font-weight="700">Every protected request afterwards</text>
  <text x="500" y="260" text-anchor="middle" font-size="13" fill="#4B5563">cookie → protect() verifies JWT → loads customer → req.user → controller runs</text>
</svg>
