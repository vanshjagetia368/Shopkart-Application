<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs>
  <rect width="1000" height="310" rx="20" fill="#F8F9FE"/>
  <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="800" fill="#111827">Order Lifecycle</text>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="30" y="95" width="150" height="56" rx="28" fill="#F59E0B"/><text x="105" y="128">PENDING_PAYMENT</text>
    <rect x="225" y="95" width="130" height="56" rx="28" fill="#5B5BF6"/><text x="290" y="128">PLACED</text>
    <rect x="400" y="95" width="140" height="56" rx="28" fill="#7B7BFF"/><text x="470" y="128">CONFIRMED</text>
    <rect x="585" y="95" width="130" height="56" rx="28" fill="#8B93FF"/><text x="650" y="128">SHIPPED</text>
    <rect x="760" y="95" width="150" height="56" rx="28" fill="#10B981"/><text x="835" y="128">DELIVERED</text>
  </g>
  <g stroke="#6B7280" stroke-width="2.5" marker-end="url(#m2)">
    <line x1="182" y1="123" x2="223" y2="123"/><line x1="357" y1="123" x2="398" y2="123"/><line x1="542" y1="123" x2="583" y2="123"/><line x1="717" y1="123" x2="758" y2="123"/>
  </g>
  <text x="203" y="84" text-anchor="middle" font-size="11" fill="#047857">signature valid</text>
  <rect x="30" y="195" width="450" height="80" rx="14" fill="#fff" stroke="#FCD34D"/>
  <text x="48" y="222" font-size="14" font-weight="800" fill="#B45309">Payment status</text>
  <text x="48" y="246" font-size="13" fill="#4B5563">PENDING → PAID when the signature matches</text>
  <text x="48" y="264" font-size="13" fill="#4B5563">FAILED when it does not (cart is kept)</text>
  <rect x="520" y="195" width="450" height="80" rx="14" fill="#fff" stroke="#C7C7FA"/>
  <text x="538" y="222" font-size="14" font-weight="800" fill="#4040D9">Implemented today</text>
  <text x="538" y="246" font-size="13" fill="#4B5563">Order is created, paid and placed by the app.</text>
  <text x="538" y="264" font-size="13" fill="#4B5563">Later stages are defined in the model, ready for admin updates.</text>
