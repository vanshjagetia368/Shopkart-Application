<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B5BF6"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10B981"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5B5BF6" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="1100" height="430" rx="20" fill="#F8F9FE"/>
  <text x="550" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">System Architecture</text>

  <!-- Browser -->
  <g filter="url(#s)">
    <rect x="40" y="90" width="270" height="250" rx="16" fill="#fff" stroke="#C7C7FA"/>
  </g>
  <text x="175" y="122" text-anchor="middle" font-size="16" font-weight="800" fill="#4040D9">React SPA</text>
  <text x="175" y="142" text-anchor="middle" font-size="12" fill="#6B7280">Vite · React Router · Axios</text>
  <rect x="62" y="162" width="226" height="34" rx="8" fill="#EEF0FC"/><text x="175" y="184" text-anchor="middle" font-size="13" fill="#111827">Pages &amp; Components</text>
  <rect x="62" y="206" width="226" height="34" rx="8" fill="#EEF0FC"/><text x="175" y="228" text-anchor="middle" font-size="13" fill="#111827">CartContext (global state)</text>
  <rect x="62" y="250" width="226" height="34" rx="8" fill="#EEF0FC"/><text x="175" y="272" text-anchor="middle" font-size="13" fill="#111827">ProtectedRoute guard</text>
  <rect x="62" y="294" width="226" height="34" rx="8" fill="#EEF0FC"/><text x="175" y="316" text-anchor="middle" font-size="13" fill="#111827">api.js (withCredentials)</text>

  <!-- API -->
  <g filter="url(#s)">
    <rect x="415" y="90" width="270" height="250" rx="16" fill="#fff" stroke="#C7C7FA"/>
  </g>
  <text x="550" y="122" text-anchor="middle" font-size="16" font-weight="800" fill="#4040D9">Express REST API</text>
  <text x="550" y="142" text-anchor="middle" font-size="12" fill="#6B7280">Node.js · Express 5</text>
  <rect x="437" y="162" width="226" height="34" rx="8" fill="#EEF0FC"/><text x="550" y="184" text-anchor="middle" font-size="13" fill="#111827">Routes → Controllers</text>
  <rect x="437" y="206" width="226" height="34" rx="8" fill="#EEF0FC"/><text x="550" y="228" text-anchor="middle" font-size="13" fill="#111827">protect() JWT middleware</text>
  <rect x="437" y="250" width="226" height="34" rx="8" fill="#EEF0FC"/><text x="550" y="272" text-anchor="middle" font-size="13" fill="#111827">Mongoose models</text>
  <rect x="437" y="294" width="226" height="34" rx="8" fill="#EEF0FC"/><text x="550" y="316" text-anchor="middle" font-size="13" fill="#111827">HMAC signature verification</text>

  <!-- DB -->
  <g filter="url(#s)">
    <rect x="790" y="90" width="270" height="110" rx="16" fill="#fff" stroke="#BFE9D9"/>
  </g>
  <text x="925" y="126" text-anchor="middle" font-size="16" font-weight="800" fill="#047857">MongoDB</text>
  <text x="925" y="148" text-anchor="middle" font-size="12" fill="#6B7280">customers · products · orders</text>
  <text x="925" y="170" text-anchor="middle" font-size="12" fill="#6B7280">cart &amp; wishlist embedded in customer</text>

  <!-- Razorpay -->
  <g filter="url(#s)">
    <rect x="790" y="230" width="270" height="110" rx="16" fill="#fff" stroke="#F4C7C7"/>
  </g>
  <text x="925" y="266" text-anchor="middle" font-size="16" font-weight="800" fill="#DC2626">Razorpay</text>
  <text x="925" y="288" text-anchor="middle" font-size="12" fill="#6B7280">Orders API · Checkout.js</text>
  <text x="925" y="310" text-anchor="middle" font-size="12" fill="#6B7280">Test mode</text>

  <!-- arrows -->
  <line x1="312" y1="190" x2="413" y2="190" stroke="#5B5BF6" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="413" y1="240" x2="312" y2="240" stroke="#5B5BF6" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="363" y="180" text-anchor="middle" font-size="11" fill="#4040D9">HTTPS + cookie</text>
  <text x="363" y="258" text-anchor="middle" font-size="11" fill="#4040D9">JSON</text>

  <line x1="687" y1="145" x2="788" y2="145" stroke="#10B981" stroke-width="2.5" marker-end="url(#g)" marker-start="url(#g)"/>
  <text x="737" y="135" text-anchor="middle" font-size="11" fill="#047857">Mongoose</text>

  <line x1="687" y1="285" x2="788" y2="285" stroke="#EF4444" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="737" y="275" text-anchor="middle" font-size="11" fill="#DC2626">create order</text>

  <path d="M175 342 V392 H925 V342" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="550" y="384" text-anchor="middle" font-size="12" fill="#DC2626">Razorpay Checkout opens in the browser; payment id + signature return to the API for verification</text>
  <rect x="150" y="402" width="800" height="1" fill="none"/>
  <text x="550" y="420" text-anchor="middle" font-size="12" fill="#6B7280">Frontend and API are deployed as two separate services on Render</text>
</svg>
